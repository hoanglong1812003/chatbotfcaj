name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKER_IMAGE: fcaj-chatbot
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: pip install flake8 black
          
      - name: Run flake8
        run: flake8 app.py process_docs.py --count --select=E9,F63,F7,F82 --show-source --statistics
        
      - name: Check code formatting
        run: black --check app.py process_docs.py

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
          
      - name: Run tests
        run: pytest --cov=. --cov-report=xml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=develop,enable={{is_default_branch}}
            
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}:buildcache,mode=max

  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
          
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            cd /opt/fcaj-chatbot
            
            # Backup current version
            docker tag ${{ env.REGISTRY }}/${{ github.repository }}:develop ${{ env.REGISTRY }}/${{ github.repository }}:develop-backup || true
            
            # Pull new image
            docker-compose pull
            
            # Deploy with zero-downtime
            docker-compose up -d --no-deps --build
            
            # Wait for health check
            echo "Waiting for container to be healthy..."
            sleep 10
            
            # Check if container is running
            if ! docker-compose ps | grep -q "Up"; then
              echo "Deployment failed! Rolling back..."
              docker tag ${{ env.REGISTRY }}/${{ github.repository }}:develop-backup ${{ env.REGISTRY }}/${{ github.repository }}:develop
              docker-compose up -d --no-deps
              exit 1
            fi
            
            # Health check
            if ! curl -f http://localhost:8501/_stcore/health; then
              echo "Health check failed! Rolling back..."
              docker tag ${{ env.REGISTRY }}/${{ github.repository }}:develop-backup ${{ env.REGISTRY }}/${{ github.repository }}:develop
              docker-compose up -d --no-deps
              exit 1
            fi
            
            echo "Deployment successful!"
            
            # Clean up old images (keep last 3 versions)
            docker images ${{ env.REGISTRY }}/${{ github.repository }} --format "{{.ID}} {{.CreatedAt}}" | sort -rk 2 | awk 'NR>3{print $1}' | xargs -r docker rmi || true
